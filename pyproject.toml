[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotvm-tool"
version = "0.1.0"
description = "Azure Spot VM placement score analysis tool"
readme = "README.md"
authors = [{name = "Arkadium IT"}]
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.16.0",
    "requests>=2.32.0",
    "PyYAML>=6.0",
    "wcwidth>=0.2.0",
]
keywords = ["azure", "spot", "virtual machines", "placement score"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
spotvm-tool = "spotvm_tool.cli:main"
