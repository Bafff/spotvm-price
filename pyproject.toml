[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotvm"
version = "0.3.1"
description = "Azure Spot VM analysis with auto-discovery, filtering, continuous monitoring, and color-coded risk indicators"
readme = "README.md"
authors = [{name = "Arkadium IT"}]
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.16.0",
    "requests>=2.32.0",
    "PyYAML>=6.0",
    "wcwidth>=0.2.0",
    "colorama>=0.4.6",
]
keywords = ["azure", "spot", "virtual machines", "placement score"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
spotvm = "spotvm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["spotvm*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
