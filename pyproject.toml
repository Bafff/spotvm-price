[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotvm"
version = "0.4.0"
description = "Azure Spot VM analysis with auto-discovery, filtering, continuous monitoring, and color-coded risk indicators"
readme = "README.md"
authors = [{name = "Arkadium IT"}]
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.16.0",
    "requests>=2.32.0",
    "PyYAML>=6.0",
    "wcwidth>=0.2.0",
    "colorama>=0.4.6",
]
keywords = ["azure", "spot", "virtual machines", "placement score"]

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "pre-commit==4.3.0",
    "pytest>=8.3",
    "ruff==0.15.5",
    "types-requests>=2.32.4",
]

[project.scripts]
spotvm = "spotvm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["spotvm*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "RUF",  # Ruff-specific rules
    "I",    # isort
    "T20",  # flake8-print
    "PIE",  # misc lints
    "PT",   # pytest style
    "C4",   # flake8-comprehensions
    "PTH",  # pathlib usage
    "RET",  # flake8-return
]
extend-select = [
    "TRY",  # tryceratops
]
ignore = ["E501"]  # handled by Ruff formatter

[tool.ruff.lint.per-file-ignores]
"src/spotvm/cli.py" = ["T201"]
"src/spotvm/config.py" = ["TRY003"]
"tests/*" = ["TRY003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
